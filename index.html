  <style>
    :root {
      --bg: #eef1f6;
      --bg-warm: #f4f6fa;
      --surface: #ffffff;
      --text: #111111;
      --muted: rgba(17, 17, 17, .65);
      --accent: #004182;
      --accent-dark: #002d5c;
      --accent-light: #dce8f4;
      --line: rgba(0, 65, 130, .14);
      --radius-sm: 10px;
      --radius-md: 20px;
      --radius-pill: 999px;
      --container: 1120px;
      --gutter: clamp(16px, 4vw, 32px);
      --header-h: 64px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: clip; }
    body {
      margin: 0;
      font-family: Montserrat, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }

    .lp-eu { font-weight: 800; color: var(--accent-dark); }
    .lp-wrap {
      width: 100%;
      max-width: var(--container);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    .lp-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 100;
      height: var(--header-h);
      background: var(--accent-dark);
    }
    .lp-header-spacer { height: var(--header-h); }

    .lp-hero {
      padding: clamp(20px, 3vw, 28px) 0 0;
      min-height: calc(100vh - var(--header-h));
      display: flex;
      background:
        radial-gradient(ellipse 80% 55% at 100% 0%, rgba(0, 65, 130, .08), transparent 55%),
        var(--bg-warm);
    }
    .lp-hero > .lp-wrap {
      flex: 1;
      display: flex;
      align-items: flex-end;
      padding-bottom: 0;
    }
    .lp-hero__grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 46%);
      gap: clamp(16px, 3vw, 32px);
      align-items: end;
      width: 100%;
      padding-bottom: clamp(16px, 2vw, 24px);
    }
    .lp-hero__content { min-width: 0; padding-bottom: clamp(16px, 2vw, 24px); }
    .lp-hero h1 {
      margin: 0;
      font-size: clamp(26px, 3.5vw, 40px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -.02em;
      max-width: 14ch;
    }
    .lp-hero__lead {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 1.2vw, 17px);
      font-weight: 600;
      line-height: 1.35;
    }
    .lp-highlights {
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      max-width: 480px;
    }
    .lp-highlights li {
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      box-shadow: 0 4px 16px rgba(0, 45, 92, .06);
    }
    .lp-highlights strong {
      color: var(--accent-dark);
      font-weight: 800;
    }
    .lp-hero .lp-actions {
      margin-top: 18px;
      max-width: 480px;
    }
    .lp-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .lp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .lp-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .lp-btn--fill { background: var(--accent); color: #fff; }
    .lp-btn--outline {
      background: var(--surface);
      border-color: rgba(0, 65, 130, .3);
      color: var(--accent-dark);
    }
    .lp-hero__photo {
      margin: 0;
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .lp-hero__photo img {
      width: 100%;
      max-width: 460px;
      max-height: calc(100vh - var(--header-h) - 32px);
      height: auto;
      display: block;
      object-fit: contain;
      object-position: bottom center;
    }

    @media (min-width: 901px) and (max-height: 820px) {

      .lp-hero__lead { font-size: 14px; margin-top: 6px; }
      .lp-highlights { margin-top: 14px; gap: 6px; }
      .lp-highlights li { padding: 10px 12px; font-size: 14px; }
      .lp-hero .lp-actions { margin-top: 14px; }
      .lp-hero__photo img { max-width: 400px; max-height: calc(100vh - var(--header-h) - 24px); }
    }

    .lp-reviews {
      padding: clamp(40px, 6vw, 64px) 0;
      background: var(--surface);
    }
    .lp-reviews h2 {
      margin: 0 0 28px;
      text-align: center;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 700;
    }
    .lp-reviews__grid {
      columns: 4 220px;
      column-gap: 12px;
    }
    .lp-review {
      margin: 0 0 12px;
      break-inside: avoid;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--bg);
    }
    .lp-review img { width: 100%; height: auto; display: block; }
    .lp-reviews__more { display: none; }
    .lp-reviews__more.is-open { display: block; }
    .lp-reviews__toggle {
      display: block;
      width: 100%;
      max-width: 280px;
      margin: 28px auto 0;
      padding: 14px 24px;
      border: 2px solid var(--accent);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--accent);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .lp-reviews__toggle:hover { background: var(--accent); color: #fff; }

    .lp-bottom {
      padding: clamp(48px, 7vw, 72px) 0;
      background: var(--accent-light);
      text-align: center;
    }
    .lp-bottom h2 {
      margin: 0;
      font-size: clamp(24px, 3.5vw, 34px);
      font-weight: 700;
    }
    .lp-bottom .lp-actions { justify-content: center; margin-top: 24px; }

    .lp-float {
      position: fixed;
      right: clamp(16px, 3vw, 28px);
      bottom: clamp(20px, 4vw, 36px);
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }
    .lp-float__label {
      padding: 8px 14px;
      background: var(--accent-dark);
      color: #fff;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 45, 92, .25);
    }
    .lp-float__btns { display: flex; gap: 10px; }
    .lp-float__btn {
      width: 52px; height: 52px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(0, 65, 130, .35);
    }
    .lp-float__btn svg { width: 24px; height: 24px; }

    @media (max-width: 900px) {
      .lp-hero { min-height: auto; padding-bottom: 0; }
      .lp-hero > .lp-wrap { align-items: stretch; }
      .lp-hero__grid { grid-template-columns: 1fr; align-items: end; padding-bottom: 0; }
      .lp-hero h1, .lp-hero__lead, .lp-highlights { max-width: none; }
      .lp-hero__content { padding-bottom: 20px; }
      .lp-hero__photo { justify-content: center; }
      .lp-hero__photo img { max-width: min(88vw, 360px); max-height: 52vh; }
      .lp-reviews__grid { columns: 2 160px; }
    }
    @media (max-width: 600px) {
      :root { --header-h: 56px; }
      .lp-btn { flex: 1 1 100%; }
      .lp-reviews__grid { columns: 2 140px; column-gap: 8px; }
      .lp-review { margin-bottom: 8px; }
      .lp-float__label { display: none; }
    }
    @media (min-width: 901px) {
      .lp-reviews__toggle { display: none; }
      .lp-reviews__more { display: block !important; }
    }
  </style>
</head>

      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.textContent = open ? 'Скрыть отзывы' : 'Больше отзывов';
